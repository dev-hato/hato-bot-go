---
services:
  hato-bot-go:
    build:
      dockerfile: ./Dockerfile
      context: .
      args:
        BUILDKIT_INLINE_CACHE: 1
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
      cache_from:
        - type=registry,ref=ghcr.io/${REPOSITORY:-dev-hato/hato-bot-go}/hato-bot-go:buildcache
        - ghcr.io/${REPOSITORY:-dev-hato/hato-bot-go}/hato-bot-go:${TAG_NAME}
        - ghcr.io/${REPOSITORY:-dev-hato/hato-bot-go}/hato-bot-go
    image: ghcr.io/${REPOSITORY:-dev-hato/hato-bot-go}/hato-bot-go:${TAG_NAME}
    environment:
      - MISSKEY_DOMAIN=${MISSKEY_DOMAIN}
      - MISSKEY_API_TOKEN=${MISSKEY_API_TOKEN}
      - MIXI2_CLIENT_ID=${MIXI2_CLIENT_ID}
      - MIXI2_CLIENT_SECRET=${MIXI2_CLIENT_SECRET}
      - MIXI2_TOKEN_URL=${MIXI2_TOKEN_URL}
      - MIXI2_API_ADDRESS=${MIXI2_API_ADDRESS}
      - MIXI2_STREAM_ADDRESS=${MIXI2_STREAM_ADDRESS}
      - YAHOO_API_TOKEN=${YAHOO_API_TOKEN}
    restart: unless-stopped
    # ポートを公開（必要に応じて）
    expose:
      - 8080
    volumes:
      - type: bind
        source: /tmp
        target: /tmp
